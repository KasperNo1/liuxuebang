<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EchoTranslate — 实时翻译</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#f7f8fa;--white:#fff;--border:#e8eaed;
  --text:#1a1a2e;--muted:#6b7280;--light:#9ca3af;
  --blue:#2563eb;--blue-light:#eff6ff;--blue-border:#bfdbfe;
  --green:#059669;--green-light:#ecfdf5;
  --panel:#07080e;--panel-border:#141824;
  --zh:#7ec8ff;--en:#1c2840;--record:#8ab0d8;
}
body{background:var(--bg);color:var(--text);font-family:'Noto Sans SC',sans-serif;height:100vh;display:flex;flex-direction:column;overflow:hidden;}
nav{background:var(--white);border-bottom:1px solid var(--border);padding:0 20px;height:52px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;z-index:10;}
.logo{font-size:16px;font-weight:700;text-decoration:none;color:var(--text);display:flex;align-items:center;gap:6px;}
.logo-dot{width:7px;height:7px;border-radius:50%;background:var(--blue);}
.nav-right{display:flex;align-items:center;gap:10px;}
.mode-badge{font-size:11px;font-weight:600;padding:3px 9px;border-radius:12px;}
.mode-cap{background:var(--blue-light);color:var(--blue);border:1px solid var(--blue-border);}
.mode-mic{background:var(--green-light);color:var(--green);border:1px solid #a7f3d0;}
.nav-sel{background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--muted);font-size:12px;padding:4px 7px;font-family:inherit;}
.nav-btn{font-size:12px;font-weight:500;padding:5px 12px;border-radius:7px;border:1px solid var(--border);cursor:pointer;font-family:inherit;background:var(--white);color:var(--muted);text-decoration:none;display:inline-flex;align-items:center;}
.nav-btn:hover{color:var(--text);}
.btn-start{background:var(--blue)!important;color:#fff!important;border-color:var(--blue)!important;}
.btn-start:hover{background:#1d4ed8!important;}
.btn-stop{background:#dc2626!important;color:#fff!important;border-color:#dc2626!important;}
.main{flex:1;display:flex;overflow:hidden;}
.left{flex:1;display:flex;flex-direction:column;overflow:hidden;background:var(--panel);}
.display{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 32px;gap:20px;text-align:center;}
.cur-en{font-size:16px;color:#2a3a55;font-family:Helvetica Neue,Arial,sans-serif;line-height:1.5;min-height:24px;max-width:720px;}
.cur-zh{font-size:36px;font-weight:500;color:var(--zh);line-height:1.4;letter-spacing:.02em;min-height:52px;max-width:720px;}
.statusbar{background:#050609;border-top:1px solid var(--panel-border);padding:10px 20px;display:flex;align-items:center;gap:10px;flex-shrink:0;}
.status-dot{width:7px;height:7px;border-radius:50%;background:#1e2840;flex-shrink:0;transition:background .3s;}
.status-dot.on{background:#3ecf8e;box-shadow:0 0 6px rgba(62,207,142,.5);animation:pulse 1.5s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.4;}}
.status-text{font-size:12px;color:#2a3840;flex:1;}
.s-sel{background:#0a0c14;border:1px solid var(--panel-border);border-radius:5px;color:#4a6a90;font-size:11px;padding:3px 6px;font-family:inherit;}
.s-btn{background:none;border:1px solid var(--panel-border);border-radius:5px;color:#1e2a3a;font-size:11px;padding:3px 8px;cursor:pointer;font-family:inherit;}
.s-btn:hover{color:#4a6a90;}
.right{width:272px;background:var(--panel);border-left:1px solid var(--panel-border);display:flex;flex-direction:column;flex-shrink:0;transition:width .2s;}
.right.collapsed{width:0;overflow:hidden;}
.rhead{padding:8px 14px;border-bottom:1px solid var(--panel-border);background:#050609;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
.rtitle{font-size:10px;font-weight:700;color:#3a72e0;letter-spacing:.12em;text-transform:uppercase;}
.rbtn{background:none;border:none;color:#1e2a3a;cursor:pointer;font-size:13px;}
.rbtn:hover{color:#4a6a90;}
.feed{flex:1;overflow-y:auto;}
.feed::-webkit-scrollbar{width:2px;}
.feed::-webkit-scrollbar-thumb{background:var(--panel-border);}
.fi{padding:9px 14px;border-bottom:1px solid #090c14;}
.fi.active{border-left:2px solid #3a72e0;background:#070b16;}
.fi-en{font-size:10px;color:var(--en);line-height:1.4;margin-bottom:3px;font-family:Helvetica Neue,Arial,sans-serif;}
.fi-zh{font-size:13px;color:var(--record);font-weight:500;line-height:1.55;}
.tab{position:fixed;right:0;top:50%;transform:translateY(-50%);z-index:99;background:#07080e;border:1px solid #141824;border-right:none;border-radius:6px 0 0 6px;padding:12px 5px;cursor:pointer;writing-mode:vertical-rl;font-size:10px;font-weight:700;color:#3a72e0;letter-spacing:.1em;display:none;font-family:'Noto Sans SC',sans-serif;}
.overlay{position:fixed;inset:0;background:rgba(6,7,14,.96);z-index:999;display:flex;align-items:center;justify-content:center;}
.overlay.hidden{display:none;}
.box{background:#0a0c16;border:1px solid #141824;border-radius:16px;padding:40px;width:360px;text-align:center;}
.box h2{font-size:20px;font-weight:700;color:#c8d8f0;margin-bottom:8px;}
.box p{font-size:13px;color:#3a4a64;margin-bottom:24px;line-height:1.6;}
.inp{width:100%;background:#060710;border:1px solid #141824;border-radius:8px;color:#c8d8f0;font-size:14px;padding:11px 14px;font-family:inherit;outline:none;margin-bottom:12px;}
.inp:focus{border-color:#3a72e0;}
.sbtn{width:100%;background:#3a72e0;border:none;border-radius:8px;color:#fff;font-size:14px;font-weight:600;padding:11px;cursor:pointer;font-family:inherit;}
.sbtn:hover{background:#2d5cc8;}
.err{font-size:12px;color:#ef4444;margin-top:8px;min-height:16px;}
.mcards{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:4px;}
.mc{background:#060710;border:1px solid #141824;border-radius:12px;padding:18px;cursor:pointer;transition:border-color .15s;text-align:left;}
.mc:hover{border-color:#3a72e0;}
.mc-i{font-size:22px;margin-bottom:8px;}
.mc-n{font-size:14px;font-weight:600;color:#c8d8f0;margin-bottom:4px;}
.mc-d{font-size:11px;color:#3a4a64;line-height:1.5;}
.mc-t{display:inline-block;margin-top:7px;font-size:10px;font-weight:600;padding:2px 7px;border-radius:4px;}
.tb{background:rgba(58,114,224,.12);color:#3a72e0;border:1px solid rgba(58,114,224,.2);}
.tg{background:rgba(62,207,142,.1);color:#3ecf8e;border:1px solid rgba(62,207,142,.2);}
</style>
</head>
<body>
<div class="overlay" id="ov-login">
  <div class="box">
    <h2>EchoTranslate</h2>
    <p>UNSW 留学生实时翻译工具<br>请输入访问密码开始使用</p>
    <input class="inp" id="pw" type="password" placeholder="输入密码" autocomplete="off">
    <button class="sbtn" id="pw-btn">进入 →</button>
    <div class="err" id="pw-err"></div>
  </div>
</div>
<div class="overlay hidden" id="ov-mode">
  <div class="box">
    <h2>选择翻译模式</h2>
    <p>根据使用场景选择，随时可切换</p>
    <div class="mcards">
      <div class="mc" id="mc-cap"><div class="mc-i">📺</div><div class="mc-n">Lec 字幕翻译</div><div class="mc-d">EchoVideo 录播，将此页面和视频并排，实时翻译字幕。</div><div class="mc-t tb">自动识别</div></div>
      <div class="mc" id="mc-mic"><div class="mc-i">🎤</div><div class="mc-n">Tut 语音同传</div><div class="mc-d">麦克风实时识别英语，约0.5秒出中文，适合Tutorial现场课。</div><div class="mc-t tg">语音识别</div></div>
    </div>
  </div>
</div>
<nav>
  <a class="logo" href="/"><div class="logo-dot"></div>留学帮</a>
  <div class="nav-right">
    <span class="mode-badge mode-cap" id="mbadge">📺 字幕模式</span>
    <select class="nav-sel" id="nsubj"><option value="econ">商科/经济</option><option value="law">法律</option><option value="cs">CS/工程</option><option value="bio">生物医学</option><option value="math">数学统计</option><option value="general">通用</option></select>
    <button class="nav-btn" id="sw-btn">切换模式</button>
    <button class="nav-btn" id="pip-btn" style="background:#7c3aed;color:#fff;border-color:#7c3aed">📺 屏幕字幕</button>
<button class="nav-btn btn-start" id="go-btn">▶ 开始</button>
    <a class="nav-btn" href="/">返回主页</a>
  </div>
</nav>
<div class="main">
  <div class="left">
    <div class="display">
      <div class="cur-en" id="cen">准备就绪，点击开始翻译</div>
      <div class="cur-zh" id="czh">—</div>
    </div>
    <div class="statusbar">
      <div class="status-dot" id="sdot"></div>
      <span class="status-text" id="stext">点击“开始”启动翻译</span>
      <select class="s-sel" id="ssel"><option value="econ">商科/经济</option><option value="law">法律</option><option value="cs">CS/工程</option><option value="bio">生物医学</option><option value="math">数学统计</option><option value="general">通用</option></select>
      <button class="s-btn" id="dl-btn">⬇ 记录</button><button class="s-btn" id="clr">清空</button>
    </div>
  </div>
  <div class="right" id="rp">
    <div class="rhead"><span class="rtitle">翻译记录</span><button class="rbtn" id="rfold">▶</button></div>
    <div class="feed" id="feed"></div>
  </div>
</div>
<div class="tab" id="tab">◀ 记录</div>
<script>
var API='https://echotranslate-api.vercel.app/api/translate';
localStorage.setItem('et_pwd','12345');var pwd='12345';
var subj=localStorage.getItem('et_subj')||'econ';
var mode='cap',isOn=false,rec=null,capTimer=null,busy=false,pending='',txTimer=null,cache={};
document.getElementById('ssel').value=subj;
document.getElementById('nsubj').value=subj;
['ssel','nsubj'].forEach(function(id){document.getElementById(id).onchange=function(){subj=this.value;localStorage.setItem('et_subj',subj);document.getElementById('ssel').value=subj;document.getElementById('nsubj').value=subj;cache={};};});
if(pwd){hidePwLogin();showMode();}else{document.getElementById('ov-login').classList.remove('hidden');}
function doLogin(){var v=document.getElementById('pw').value.trim();if(!v)return;document.getElementById('pw-btn').textContent='验证中...';fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:'hi',subject:'general',pw:v})}).then(function(r){if(r.status===401){document.getElementById('pw-err').textContent='密码错误，请向群主获取';document.getElementById('pw-btn').textContent='进入 →';}else{pwd=v;localStorage.setItem('et_pwd',pwd);hidePwLogin();showMode();}}).catch(function(){pwd=v;localStorage.setItem('et_pwd',pwd);hidePwLogin();showMode();});}
document.getElementById('pw-btn').onclick=doLogin;
document.getElementById('pw').onkeydown=function(e){if(e.key==='Enter')doLogin();};
function hidePwLogin(){document.getElementById('ov-login').classList.add('hidden');}
function showMode(){document.getElementById('ov-mode').classList.remove('hidden');}
function hideMode(){document.getElementById('ov-mode').classList.add('hidden');}
document.getElementById('mc-cap').onclick=function(){mode='cap';hideMode();updateUI();};
document.getElementById('mc-mic').onclick=function(){mode='mic';hideMode();updateUI();};
document.getElementById('sw-btn').onclick=function(){if(isOn)doStop();showMode();};
function updateUI(){var b=document.getElementById('mbadge');if(mode==='cap'){b.textContent='📺 字幕模式';b.className='mode-badge mode-cap';st('字幕模式 — 请并排 EchoVideo 播放视频');}else{b.textContent='🎤 同传模式';b.className='mode-badge mode-mic';st('语音同传模式 — 点开始并允许麦克风');}document.getElementById('cen').textContent='准备就绪，点开始';document.getElementById('czh').textContent='—';}
document.getElementById('go-btn').onclick=function(){isOn?doStop():doStart();};
function doStart(){isOn=true;document.getElementById('go-btn').textContent='■ 停止';document.getElementById('go-btn').className='nav-btn btn-stop';document.getElementById('sdot').className='status-dot on';if(mode==='cap')startCap();else startMic();}
function doStop(){isOn=false;document.getElementById('go-btn').textContent='▶ 开始';document.getElementById('go-btn').className='nav-btn btn-start';document.getElementById('sdot').className='status-dot';st('已停止');clearInterval(capTimer);clearTimeout(txTimer);if(rec)try{rec.stop();}catch(e){}}
function startCap(){st('📺 监听字幕中...（请并排打开 EchoVideo 播放）');
var last='';capTimer=setInterval(function(){if(!isOn)return;var s=localStorage.getItem('et_cap');if(s&&s!==last){last=s;document.getElementById('cen').textContent=s;translate(s);}},400);
try{var bc=new BroadcastChannel('et_cap');bc.onmessage=function(e){if(!isOn||e.data===last)return;last=e.data;document.getElementById('cen').textContent=e.data;translate(e.data);};window._bc=bc;}catch(e){}}
function startMic(){var SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){st('⚠ 请使用 Chrome 或 Edge 浏览器');return;}rec=new SR();rec.lang='en-AU';rec.continuous=true;rec.interimResults=true;rec.onstart=function(){st('🎤 聆听中...');};rec.onresult=function(e){var fin='',tmp='';for(var i=e.resultIndex;i<e.results.length;i++){if(e.results[i].isFinal)fin+=e.results[i][0].transcript;else tmp+=e.results[i][0].transcript;}document.getElementById('cen').textContent=(fin||tmp).trim();if(fin.trim()){pending+=' '+fin.trim();clearTimeout(txTimer);txTimer=setTimeout(function(){var t=pending.trim();pending='';if(t)translate(t);},480);}};rec.onerror=function(e){if(e.error==='not-allowed')st('⚠ 请允许麦克风权限');};rec.onend=function(){if(isOn)try{rec.start();}catch(e){}};rec.start();}
async function translate(text){if(busy){pending=text+' '+pending;return;}if(cache[text]){show(text,cache[text]);return;}busy=true;try{var r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:text,subject:subj,pw:'12345'})});if(r.status===401){localStorage.removeItem('et_pwd');pwd='';document.getElementById('ov-login').classList.remove('hidden');doStop();busy=false;return;}var d=await r.json();var zh=d.zh||'翻译失败';cache[text]=zh;show(text,zh);}catch(e){document.getElementById('czh').textContent='⚠ 网络错误';}busy=false;if(pending.trim()){var t=pending.trim();pending='';translate(t);}}
function show(en,zh){document.getElementById('czh').textContent=zh;var feed=document.getElementById('feed');var key=en.slice(0,50).replace(/['"]/g,'');if(feed.querySelector('[data-k="'+key+'"]'))return;var item=document.createElement('div');item.className='fi active';item.setAttribute('data-k',key);item.innerHTML='<div class="fi-en">'+en+'</div><div class="fi-zh">'+zh+'</div>';feed.querySelectorAll('.active').forEach(function(x){x.classList.remove('active');});feed.appendChild(item);item.scrollIntoView({behavior:'smooth',block:'nearest'});}
function st(t){document.getElementById('stext').textContent=t;}
document.getElementById('clr').onclick=function(){document.getElementById('feed').innerHTML='';document.getElementById('cen').textContent='已清空';document.getElementById('czh').textContent='—';cache={};};
document.getElementById('rfold').onclick=function(){document.getElementById('rp').classList.add('collapsed');document.getElementById('tab').style.display='block';};
document.getElementById('tab').onclick=function(){document.getElementById('rp').classList.remove('collapsed');document.getElementById('tab').style.display='none';};

var _pc=document.getElementById('pip-canvas');
var _px=_pc.getContext('2d');
var _pv=document.getElementById('pip-video');
var _pon=false,_pen='',_pzh='请开始翻译...',_praf=null;

function _draw(){
  var w=800,h=200;
  _px.fillStyle='#0a0c18';_px.fillRect(0,0,w,h);
  _px.fillStyle='#3a72e0';_px.fillRect(0,0,w,3);
  _px.font='20px Arial';_px.fillStyle='rgba(255,255,255,0.4)';
  _px.textAlign='center';_px.fillText(_pen.slice(0,90),400,48);
  _px.font='bold 54px Arial';_px.fillStyle='#7ec8ff';
  _px.fillText(_pzh.slice(0,20),400,130);
  _px.font='13px Arial';_px.fillStyle='rgba(255,255,255,0.18)';
  _px.fillText('留学帮 · EchoTranslate',400,185);
}
function _loop(){_draw();_praf=requestAnimationFrame(_loop);}

document.getElementById('pip-btn').addEventListener('click',async function(){
  if(_pon){
    if(document.pictureInPictureElement)document.exitPictureInPicture();
    cancelAnimationFrame(_praf);_pon=false;
    this.textContent='📺 屏幕字幕';
    return;
  }
  try{
    _loop();
    var stream=_pc.captureStream(10);
    _pv.srcObject=stream;
    await _pv.play();
    await _pv.requestPictureInPicture();
    _pon=true;
    this.textContent='❌ 关闭字幕';
  }catch(e){
    cancelAnimationFrame(_praf);
    alert('开启失败: '+e.message+'\n\n确认使用Chrome且已开启画中画功能');
  }
});

document.addEventListener('leavepictureinpicture',function(){
  cancelAnimationFrame(_praf);_pon=false;
  document.getElementById('pip-btn').textContent='📺 屏幕字幕';
});

var _os=show;
show=function(en,zh){_os(en,zh);_pen=en;_pzh=zh;};

document.getElementById('dl-btn').addEventListener('click',function(){
  if(!txLog||!txLog.length){alert('还没有翻译记录');return;}
  var lines=['翻译记录','导出：'+new Date().toLocaleString('zh-CN'),'='.repeat(40),''];
  txLog.forEach(function(r){lines.push('['+r.ts+'] '+r.en);lines.push('→ '+r.zh);lines.push('');});
  var b=new Blob([lines.join('\n')],{type:'text/plain;charset=utf-8'});
  var a=document.createElement('a');
  a.href=URL.createObjectURL(b);
  a.download='translate_'+new Date().toISOString().slice(0,10)+'.txt';
  a.click();
});
</script>
<canvas id="pip-canvas" width="800" height="200" style="display:none;"></canvas><video id="pip-video" style="display:none;" muted></video>
</body>
</html>
